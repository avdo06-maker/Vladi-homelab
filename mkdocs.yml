site_name: Vladi's Homelab
site_description: Documentation for my self-hosted infrastructure
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Hardware: hardware/index.md
  - Network: network/index.md
  - Services:
    - Overview: services/index.md
    - Immich: services/immich.md
    - Seafile: services/seafile.md
    - Mealie: services/mealie.md
    - Stirling PDF: services/stirling-pdf.md
    - Dockhand: services/dockhand.md
